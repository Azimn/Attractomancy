name: SCH E3 L1 semantic annotation validity guard

on:
  push:
    paths:
      - ".github/workflows/sch-e3-l1-semantic-guard.yml"
      - "experiments/SCH_E3_TRIBUNAL_OF_MEMORY/l1_semantic_adjudicate.py"
      - "experiments/SCH_E3_TRIBUNAL_OF_MEMORY/test_l1_semantic_adjudicate.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify source excerpt quotes and mandatory independent reviewer schema
        run: |
          python -m unittest discover -s experiments/SCH_E3_TRIBUNAL_OF_MEMORY \
            -p test_l1_semantic_adjudicate.py -v
