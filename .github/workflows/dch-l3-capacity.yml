name: DCH L3 Qwen 1.5B staged capacity ladder
on:
  push:
    branches:
      - research/dch-d0-pilot-20261009
    paths:
      - '.github/workflows/dch-l3-capacity.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ladder:
    name: Qwen2.5-1.5B reasoning ladder 64 generations
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      PYTHONUNBUFFERED: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      DCH: experiments/DCH_D0_SYNTHETIC_PILOT
      RUN_DIR: experiments/DCH_D0_SYNTHETIC_PILOT/results/qwen25-15b-l3-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.5.1" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers==4.51.3" "safetensors==0.5.3" "sentencepiece==0.2.0"
      - name: Validate all instrument tests
        working-directory: experiments/DCH_D0_SYNTHETIC_PILOT
        run: python -m unittest discover -s tests -v
      - name: Freeze development fixtures and evaluator-only answers
        run: python "$DCH/l3_capacity_ladder.py" prepare --folder "$RUN_DIR" --count 12
      - name: Perform 64 real-model stage-by-stage generations
        run: |
          python "$DCH/l3_capacity_ladder.py" run --folder "$RUN_DIR"             --backend transformers --model Qwen/Qwen2.5-1.5B-Instruct --histories 8
      - name: Apply isolated evaluator and validate run integrity
        run: |
          python "$DCH/l3_capacity_ladder.py" evaluate --folder "$RUN_DIR"
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUN_DIR'])
          raw=json.loads((p/'l3_raw.json').read_text())
          scored=json.loads((p/'l3_evaluation.json').read_text())
          assert raw['status']=='REAL_LLM_DEVELOPMENT' and len(raw['records'])==64
          assert all(x['model_reported']=='Qwen/Qwen2.5-1.5B-Instruct' for x in raw['records'])
          assert len(scored['summary'])==8
          assert all(v['n']==8 for v in scored['summary'].values())
          assert raw['has_human_partner'] is False
          print('L3_REAL_MODEL_RESULTS',json.dumps(scored['summary'],sort_keys=True))
          PY
      - name: Upload raw outputs on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dch-l3-qwen15b-${{ github.run_id }}
          path: ${{ env.RUN_DIR }}
          if-no-files-found: warn
          retention-days: 30
      - name: Archive completed, uniquely named results on research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add -f "$RUN_DIR"
          git commit -m "experiment(dch): archive real Qwen1.5B L3 capacity ladder [skip ci]"
          git fetch origin research/dch-d0-pilot-20261009
          git rebase origin/research/dch-d0-pilot-20261009
          git push origin HEAD:research/dch-d0-pilot-20261009
