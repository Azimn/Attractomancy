name: SCH E3 T1B isolated source field extraction

on:
  push:
    paths:
      - ".github/workflows/sch-e3-t1b-isolated.yml"
      - "experiments/SCH_E3_TRIBUNAL_OF_MEMORY/isolated_clerk.py"
      - "experiments/SCH_E3_TRIBUNAL_OF_MEMORY/test_isolated_clerk.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  isolated:
    name: T1B single-source ${{ matrix.slug }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: qwen25-05b
            model: Qwen/Qwen2.5-0.5B-Instruct
          - slug: qwen25-15b
            model: Qwen/Qwen2.5-1.5B-Instruct
          - slug: smollm2-17b
            model: HuggingFaceTB/SmolLM2-1.7B-Instruct
    env:
      PYTHONUNBUFFERED: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned local CPU inference packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.5.1" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers==4.51.3" "safetensors==0.5.3" "sentencepiece==0.2.0"
      - name: Verify source record isolation and oracle reference
        run: |
          python experiments/SCH_E3_TRIBUNAL_OF_MEMORY/isolated_clerk.py --validate-only
          python -m unittest discover -s experiments/SCH_E3_TRIBUNAL_OF_MEMORY -p test_isolated_clerk.py -v
          python -m unittest discover -s experiments/SCH_D1_EXTERNAL_RECONSTRUCTION -p test_archive_guard.py -v
      - name: Run only 12 distinct source-local model extractions
        run: |
          python experiments/SCH_E3_TRIBUNAL_OF_MEMORY/isolated_clerk.py \
            --model ${{ matrix.model }} \
            --output experiments/SCH_E3_TRIBUNAL_OF_MEMORY/results/isolated-${{ matrix.slug }}-${{ github.run_id }}
      - name: Verify raw source extractions and cached combination
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("experiments/SCH_E3_TRIBUNAL_OF_MEMORY/results/isolated-${{ matrix.slug }}-${{ github.run_id }}")
          summary=json.loads((p/"summary.json").read_text())
          rows=[json.loads(x) for x in (p/"extractions.jsonl").read_text().splitlines() if x.strip()]
          assert len(rows)==12==summary["metrics"]["model_extractions"]
          assert len({x["case"]["event_id"] for x in rows})==12
          assert len(summary["tasks"])==12 and len(summary["flips"])==6
          assert summary["metrics"]["reference_oracle_correct_by_construction"]==12
          assert summary["revision"] and len(summary["revision"])>=12
          assert summary["metrics"]["total_model_input_tokens"]==sum(r["input_tokens"] for r in rows)
          assert summary["metrics"]["total_model_output_tokens"]==sum(r["output_tokens"] for r in rows)
          print("T1B_VERIFIED",summary["model"],summary["metrics"])
          PY
      - name: Preserve original data regardless of exit code
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sch-e3-t1b-${{ matrix.slug }}-${{ github.run_id }}
          path: experiments/SCH_E3_TRIBUNAL_OF_MEMORY/results/isolated-${{ matrix.slug }}-${{ github.run_id }}/
          retention-days: 14
          if-no-files-found: warn
      - name: Archive immutable run-specific output
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/SCH_E3_TRIBUNAL_OF_MEMORY/results/isolated-${{ matrix.slug }}-${{ github.run_id }}
          git commit -m "research: archive source-isolated T1B ${{ matrix.slug }} extraction results [skip ci]"
          for n in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          echo "Push unsuccessful; model artifact preserved" >&2
          exit 1
