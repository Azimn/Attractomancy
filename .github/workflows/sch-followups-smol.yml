name: SCH follow-up independent SmolLM2 replication

on:
  push:
    paths:
      - ".github/workflows/sch-followups-smol.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smol:
    name: A2 plus B1 on SmolLM2 360M
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONUNBUFFERED: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.5.1" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers==4.51.3" "safetensors==0.5.3" "sentencepiece==0.2.0"
      - name: Validate fixtures
        run: python experiments/SCH_FOLLOWUP_2026_10_09/run.py --validate-only
      - name: Generate 80 independent A2 B1 cases
        run: |
          python experiments/SCH_FOLLOWUP_2026_10_09/run.py \
            --model HuggingFaceTB/SmolLM2-360M-Instruct \
            --output experiments/SCH_FOLLOWUP_2026_10_09/results/smollm2-360m-${{ github.run_id }}
      - name: Upload raw outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sch-followups-smollm2-${{ github.run_id }}
          path: experiments/SCH_FOLLOWUP_2026_10_09/results/smollm2-360m-${{ github.run_id }}/
          retention-days: 14
          if-no-files-found: warn
      - name: Verify and preserve completed results
        if: success()
        run: |
          python - <<'PY'
          import json, pathlib
          path=pathlib.Path("experiments/SCH_FOLLOWUP_2026_10_09/results/smollm2-360m-${{ github.run_id }}")
          s=json.loads((path/"summary.json").read_text())
          rows=[json.loads(x) for x in (path/"responses.jsonl").read_text().splitlines() if x.strip()]
          assert len(rows)==s["cases_completed"]==80
          assert len({x["case"]["id"] for x in rows})==80
          assert sum(x["prompt_tokens"] for x in rows)==s["overall_prompt_tokens"]
          assert sum(x["generated_tokens"] for x in rows)==s["overall_generated_tokens"]
          print("VERIFICATION_PASS",s["model"],len(rows))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/SCH_FOLLOWUP_2026_10_09/results/smollm2-360m-${{ github.run_id }}
          git commit -m "experiments: archive SmolLM2 A2 B1 pilot [skip ci]"
          for n in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          echo "PUSH_FAILED: workflow artifact remains available" >&2
          exit 1
