name: SCH E3 independent-review eligibility validator

on:
  push:
    paths:
      - ".github/workflows/sch-e3-adjudication-tests.yml"
      - "experiments/SCH_E3_TRIBUNAL_OF_MEMORY/adjudicate.py"
      - "experiments/SCH_E3_TRIBUNAL_OF_MEMORY/test_adjudicate.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify no incomplete or calibration-only annotations qualify
        run: |
          python -m unittest discover \
            -s experiments/SCH_E3_TRIBUNAL_OF_MEMORY \
            -p 'test_adjudicate.py' -v
