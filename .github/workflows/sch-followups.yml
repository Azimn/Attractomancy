name: SCH A2 and B1 follow-up experiments

on:
  push:
    paths:
      - ".github/workflows/sch-followups.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pilots:
    name: A2 plus B1 on ${{ matrix.slug }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: qwen25-05b
            model: Qwen/Qwen2.5-0.5B-Instruct
          - slug: qwen25-15b
            model: Qwen/Qwen2.5-1.5B-Instruct
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.5.1" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers==4.51.3" "safetensors==0.5.3" "sentencepiece==0.2.0"
      - name: Validate fixtures without model
        run: python experiments/SCH_FOLLOWUP_2026_10_09/run.py --validate-only
      - name: Generate all A2 and B1 responses
        run: |
          python experiments/SCH_FOLLOWUP_2026_10_09/run.py \
            --model ${{ matrix.model }} \
            --output experiments/SCH_FOLLOWUP_2026_10_09/results/${{ matrix.slug }}-${{ github.run_id }}
      - name: Save raw artifact on both success and failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sch-followups-${{ matrix.slug }}-${{ github.run_id }}
          path: experiments/SCH_FOLLOWUP_2026_10_09/results/${{ matrix.slug }}-${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 14
      - name: Verify completed outputs and commit result without clobbering
        if: success()
        run: |
          python - <<'PY'
          import json, pathlib
          folder=pathlib.Path("experiments/SCH_FOLLOWUP_2026_10_09/results/${{ matrix.slug }}-${{ github.run_id }}")
          summary=json.loads((folder/"summary.json").read_text())
          manifest=json.loads((folder/"manifest.json").read_text())
          lines=[json.loads(line) for line in (folder/"responses.jsonl").read_text().splitlines() if line.strip()]
          assert summary["cases_completed"] == len(lines) == 80
          assert manifest["fixture_sha256"] == summary["fixture_sha256"]
          assert len({x["case"]["id"] for x in lines}) == 80
          assert sum(x["prompt_tokens"] for x in lines) == summary["overall_prompt_tokens"]
          assert sum(x["generated_tokens"] for x in lines) == summary["overall_generated_tokens"]
          print("FULL_RUN_VERIFICATION_PASS",summary["model"],summary["cases_completed"])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/SCH_FOLLOWUP_2026_10_09/results/${{ matrix.slug }}-${{ github.run_id }}
          git commit -m "experiments: archive SCH A2 B1 ${{ matrix.slug }} pilot [skip ci]"
          for n in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "RESULTS_COMMITTED"
              exit 0
            fi
            sleep 2
          done
          echo "PUSH_FAILED: artifact remains available" >&2
          exit 1
