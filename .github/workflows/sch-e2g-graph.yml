name: SCH E2G authored association graph retrieval

on:
  push:
    paths:
      - ".github/workflows/sch-e2g-graph.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  associative:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Azimn/Pretorius-Connectome
          ref: 6d2768211f5c2184c8bbdb833c06e169b5137197
          path: pretorius_source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned numerical retrieval libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==1.26.4" "scipy==1.14.1" "scikit-learn==1.5.2"
      - name: Run 450-event source graph and random-edge controls
        run: |
          python experiments/SCH_E2_MULTIMEMORY_DECISIONS/graph_retrieval.py \
            --source pretorius_source \
            --output experiments/SCH_E2_MULTIMEMORY_DECISIONS/results/graph-run-${{ github.run_id }}
      - name: Verify frozen graph/query study
        run: |
          python - <<'PY'
          import pathlib,json
          p=pathlib.Path("experiments/SCH_E2_MULTIMEMORY_DECISIONS/results/graph-run-${{ github.run_id }}/graph_retrieval.json")
          x=json.loads(p.read_text())
          assert x["original_graph"]["node_count"]==450
          assert x["scored_queries"]==6
          assert x["original_graph"]["source_directed_links"]>400
          assert x["candidate_budgets"]==[2,5,10]
          assert len(x["totals"])==5
          assert all(len(item["conditions"])==5 for item in x["cases"])
          print("E2G_SOURCE_GRAPH_CHECK_PASS",x["totals"])
          PY
      - name: Upload original graph and ranking comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sch-e2g-${{ github.run_id }}
          path: experiments/SCH_E2_MULTIMEMORY_DECISIONS/results/graph-run-${{ github.run_id }}/
          retention-days: 14
          if-no-files-found: warn
      - name: Preserve results on main
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/SCH_E2_MULTIMEMORY_DECISIONS/results/graph-run-${{ github.run_id }}
          git commit -m "experiments: preserve E2G associative graph and null retrieval [skip ci]"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          echo "Push conflict: workflow artifact preserved" >&2
          exit 1
