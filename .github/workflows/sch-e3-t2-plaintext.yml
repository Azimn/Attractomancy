name: SCH E3 T2P3 plain-text L1 evidence copying

on:
  push:
    paths:
      - ".github/workflows/sch-e3-t2-plaintext.yml"
      - "experiments/SCH_E3_TRIBUNAL_OF_MEMORY/l1_plaintext_v3.py"
      - "experiments/SCH_E3_TRIBUNAL_OF_MEMORY/test_l1_plaintext_v3.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    name: Source field plain output ${{ matrix.slug }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: qwen25-05b
            model: Qwen/Qwen2.5-0.5B-Instruct
          - slug: qwen25-15b
            model: Qwen/Qwen2.5-1.5B-Instruct
          - slug: smollm2-17b
            model: HuggingFaceTB/SmolLM2-1.7B-Instruct
    env:
      PYTHONUNBUFFERED: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Azimn/Pretorius-Connectome
          ref: 6d2768211f5c2184c8bbdb833c06e169b5137197
          path: pretorius_source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned local CPU model packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.5.1" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers==4.51.3" "safetensors==0.5.3" "sentencepiece==0.2.0"
      - name: Check source-manifest, forbidden exemplars and plain-text scoring
        run: |
          python -m unittest discover -s experiments/SCH_E3_TRIBUNAL_OF_MEMORY -p test_l1_plaintext_v3.py -v
          python experiments/SCH_E3_TRIBUNAL_OF_MEMORY/l1_plaintext_v3.py --validate-only --source pretorius_source
          python -m unittest discover -s experiments/SCH_D1_EXTERNAL_RECONSTRUCTION -p test_archive_guard.py -v
      - name: Run 72 raw one-line field prompts on read-only L1
        run: |
          python experiments/SCH_E3_TRIBUNAL_OF_MEMORY/l1_plaintext_v3.py \
            --model ${{ matrix.model }} --source pretorius_source \
            --output experiments/SCH_E3_TRIBUNAL_OF_MEMORY/results/l1-plain-${{ matrix.slug }}-${{ github.run_id }}
      - name: Verify all raw answers, field conditions and token totals
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("experiments/SCH_E3_TRIBUNAL_OF_MEMORY/results/l1-plain-${{ matrix.slug }}-${{ github.run_id }}")
          s=json.loads((p/"summary.json").read_text())
          data=[json.loads(x) for x in (p/"responses.jsonl").read_text().splitlines() if x.strip()]
          assert len(data)==72==s["cases_completed"]
          assert len({r["case"]["case_id"] for r in data})==72
          assert len(set(s["selected_episodes"]))==12
          assert s["source"]["record_count"]==450
          assert len(s["groups"])==3 and all(x["n"]==24 for x in s["groups"])
          assert all(r["case"]["expected"] is None for r in data if r["case"]["arm"]=="target_withheld")
          assert all(r["case"]["expected"] is not None for r in data if r["case"]["arm"]!="target_withheld")
          assert s["model_revision"] and len(s["model_revision"])>=12
          assert s["total_input_tokens"]==sum(r["prompt_tokens"] for r in data)
          assert s["total_output_tokens"]==sum(r["output_tokens"] for r in data)
          assert s["not_confirmatory_due_to_prior_prompt_inspection"]
          print("E3_PLAIN_L1_VERIFIED",s["model"],s["groups"])
          PY
      - name: Retain original artifacts on failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sch-e3-l1-plain-${{ matrix.slug }}-${{ github.run_id }}
          path: experiments/SCH_E3_TRIBUNAL_OF_MEMORY/results/l1-plain-${{ matrix.slug }}-${{ github.run_id }}/
          retention-days: 14
          if-no-files-found: warn
      - name: Commit unique model outputs on success
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/SCH_E3_TRIBUNAL_OF_MEMORY/results/l1-plain-${{ matrix.slug }}-${{ github.run_id }}
          git commit -m "research: preserve v3 plain-source L1 ${{ matrix.slug }} model outputs [skip ci]"
          for n in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          echo "Result push failed: raw workflow artifact retained" >&2
          exit 1
