name: SCH E3 T3 relationship reviewer validity

on:
  push:
    paths:
      - ".github/workflows/sch-e3-t3-reviewer-guard.yml"
      - "experiments/SCH_E3_TRIBUNAL_OF_MEMORY/l1_relationship_adjudicate.py"
      - "experiments/SCH_E3_TRIBUNAL_OF_MEMORY/test_l1_relationship_adjudicate.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Require three distinct source-citing reviewers, no recency-only revocation
        run: |
          python -m unittest discover -s experiments/SCH_E3_TRIBUNAL_OF_MEMORY \
            -p test_l1_relationship_adjudicate.py -v
