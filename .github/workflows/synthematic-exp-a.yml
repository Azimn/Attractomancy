name: SCH Experiment A zero-shot pilot

on:
  push:
    paths:
      - "experiments/EXP-A_ZERO_SHOT_SYNTHEMATA/run.py"
      - "experiments/EXP-A_ZERO_SHOT_SYNTHEMATA/conditions.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: synthematic-exp-a-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pilot:
    name: CPU open-model zero-shot pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - name: Check out experiment
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.5.1" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers==4.51.3" "safetensors==0.5.3" "sentencepiece==0.2.0"
      - name: Validate frozen pilot fixture
        run: python experiments/EXP-A_ZERO_SHOT_SYNTHEMATA/run.py --validate-only
      - name: Run actual 30-case zero-shot pilot
        run: |
          python experiments/EXP-A_ZERO_SHOT_SYNTHEMATA/run.py \
            --model Qwen/Qwen2.5-0.5B-Instruct \
            --output experiments/EXP-A_ZERO_SHOT_SYNTHEMATA/results/pilot-${{ github.run_id }}
      - name: Preserve raw generations and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthematic-exp-a-pilot-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            experiments/EXP-A_ZERO_SHOT_SYNTHEMATA/results/pilot-${{ github.run_id }}/
      - name: Commit exploratory pilot results to repository
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/EXP-A_ZERO_SHOT_SYNTHEMATA/results/pilot-${{ github.run_id }}
          if git diff --cached --quiet; then
            echo "No new experimental output files"
          else
            git commit -m "experiments: preserve EXP-A open-model exploratory outputs [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
